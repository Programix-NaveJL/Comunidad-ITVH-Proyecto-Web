  <!--
    CSS del splash, inline y antes que cualquier <link>: así se pinta
    de inmediato sin esperar a que terminen de bajar las demás hojas
    de estilo. Se queda visible un mínimo de 3s (ver router.js →
    programarCierreSplash) y luego hace fade-out.
  -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0B0B0F;
      transition: opacity 0.5s ease;
    }
    #splash.splash--oculto {
      opacity: 0;
      pointer-events: none;
    }
    #splash .splash-logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }
    #splash .splash-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #007AFF;
      animation: splash-girar 0.8s linear infinite;
    }
    #splash .splash-marca {
      position: absolute;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0.55;
    }
    #splash .splash-marca__label {
      color: #fff;
      font-size: 11px;
      letter-spacing: 0.4px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #splash .splash-marca img {
      width: 130px;
      height: auto;
      object-fit: contain;
    }
    @keyframes splash-girar {
      to { transform: rotate(360deg); }
    }
  </style>

  <!--
    Splash de arranque — HTML puro, se pinta de inmediato sin esperar
    el bundle de módulos. Se queda visible un mínimo de 3s (ver
    router.js → programarCierreSplash, que lee window.__splashInicio
    de abajo) y luego hace fade-out.
  -->
  <div id="splash">
    <img src="assets/icons/splash_foreground.png" alt="" class="splash-logo" />
    <span class="splash-spinner"></span>
    <div class="splash-marca">
      <span class="splash-marca__label">por</span>
      <img src="assets/icons/logo_programix_navejl.png" alt="Programix NaveJL" />
    </div>
  </div>
  <script>window.__splashInicio = Date.now();</script>

  <!-- Contenedor único donde el router pinta la pantalla activa -->
  <div id="app"></div>

  <!--
    Punto de entrada de la app. Se declara como módulo ES para poder
    usar import/export entre archivos. El orden de los imports no
    importa: cada pantalla se auto-registra en el router al cargarse
    (ver el final de cada archivo en js/auth/ y js/features/).
  -->
  <script type="module">
  import './js/core/router.js';
  import './js/auth/iniciar-sesion.js';
  import './js/auth/crear-cuenta.js';
